version: '3.8'

services:
  # Redis service for BullMQ
  redis:
    image: redis:7-alpine
    container_name: delivery_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # Optional: Redis Commander Web UI to view Redis keys in your browser
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: delivery_redis_commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  redis_data:
